name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Download yt-dlp.exe (official release)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "yt-dlp.exe"

      - name: Download FFmpeg essentials (gyan.dev)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-x
          $ff = Get-ChildItem -Recurse -Filter ffmpeg.exe ffmpeg-x | Select-Object -First 1
          Copy-Item $ff.FullName "ffmpeg.exe"

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item target/release/yt4k-downloader.exe package/
          Copy-Item yt-dlp.exe package/
          Copy-Item ffmpeg.exe package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath YT4KDownloader-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT4KDownloader-Windows-x64
          path: YT4KDownloader-Windows-x64.zip
